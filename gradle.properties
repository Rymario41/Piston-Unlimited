org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

modId=multipiston
modGroup=com.ldtteam
modVersion=0.0.1

javaVersion=25
useJavaToolChains=true

# NeoForge version from the official Minecraft 26.3 NeoGradle MDK.
forgeVersion=26.3.0.10-beta

forge_range=[26.3.0.10-beta,)
minecraft_range=[26.3]

#The version for forge (dependency)
exactMinecraftVersion=26.3
#The main version on curseforge
minecraftVersion=26.3
#Semicolon seperated list of mc versions, which are marked as compatible on curseforge
additionalMinecraftVersions=

# Retained for this build-system stage; these are NOT verified 26.3-compatible mods.
# Their API/runtime migration is a separate stage, not a reason to exclude them.
blockUiVersion=1.0.188-1.21.1-snapshot
structurizeVersion=1.0.751-1.21.1-snapshot

requiredCurseDependencies=blockui;structurize

githubUrl=https://github.com/ldtteam/BlockUI
gitUrl=https://github.com/ldtteam/BlockUI.git
gitConnectUrl=https://github.com/ldtteam/BlockUI.git
projectUrl=https://github.com/ldtteam/BlockUI

curseId=303278
usesCurse=true

# Minecraft 26.3 ships unobfuscated names; no legacy Parchment overlay is needed.

runtimeSourceSets=main
projectHasApi=false
